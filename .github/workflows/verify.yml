name: Verify catalog and phone interactions
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: npm audit --audit-level=high
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-browser-pixels
          path: verification/current/
          retention-days: 7
